name: CI

# 门禁目标：ruff check + ruff format + mypy + pytest 四项全绿。
#
# 布局前提：**本仓库根目录就是项目根目录**（port-guard/ 下的内容直接放在仓库根）。
# 不要把 paths 过滤写回 `port-guard/**` —— 那样没有任何文件能匹配，工作流会
# 永远不触发，而且不会报错，只会安静地什么都不做。

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest      # 目标平台就是 Windows：防火墙/编码相关逻辑必须在此验证
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # runner 是无桌面的服务会话：不指定离屏平台，Qt 可能卡在建原生窗口句柄
      QT_QPA_PLATFORM: offscreen

    steps:
      - uses: actions/checkout@v4

      # 离线 IP 库（v4 约 11 MB + v6 约 37 MB）**不入版本库**（.gitignore 排除了
      # data/*.xdb），而归属地解析、在线同步、备份回滚、以及部分规则打分用例都
      # 需要真实库文件才能跑 —— 新克隆的仓库里没有，直接跑会有十几条用例红。
      # 这里现场拉一份，路径与 core/config.py 的 XDB_UPSTREAM（data/ 下）一致。
      - name: 准备离线 IP 库（不入版本库，现场拉取）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path data | Out-Null
          $base = 'https://raw.githubusercontent.com/lionsoul2014/ip2region/master/data'
          foreach ($n in @('ip2region_v4.xdb', 'ip2region_v6.xdb')) {
            $dst = Join-Path 'data' $n
            if ((Test-Path $dst) -and ((Get-Item $dst).Length -gt 1MB)) { continue }
            Invoke-WebRequest -Uri "$base/$n" -OutFile $dst -UseBasicParsing -TimeoutSec 180
            "{0}  {1:N1} MB" -f $n, ((Get-Item $dst).Length / 1MB)
          }

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff mypy

      # 防回退：requirements.txt 一旦被改回 `PySide6`（完整版），会静默多装
      # Addons / WebEngine / Pdf 约 441 MB，而界面一个都用不到。这里直接卡住。
      - name: 依赖瘦身校验（必须只用 PySide6-Essentials）
        shell: pwsh
        run: |
          $bad = @('PySide6', 'PySide6-Addons', 'PySide6-WebEngine', 'PySide6-Pdf')
          $found = pip list --format=freeze |
            Where-Object { $bad -contains ($_ -split '==')[0] }
          if ($found) {
            Write-Error "检测到完整版 PySide6 组件，请改用 PySide6-Essentials：`n$found"
            exit 1
          }
          Write-Host 'OK：仅安装了 PySide6-Essentials'

      - name: 代码规范与静态缺陷（ruff）
        run: ruff check . --output-format=github

      - name: 格式检查（ruff format）
        run: ruff format --check .

      - name: 类型检查（mypy）
        run: mypy .

      - name: 单元测试 + 覆盖率
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
