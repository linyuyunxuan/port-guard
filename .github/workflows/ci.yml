name: CI

# 门禁目标：ruff check + ruff format + mypy + pytest 四项全绿。

on:
  push:
    branches: ["**"]
    paths:
      - "port-guard/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "port-guard/**"
      - ".github/workflows/ci.yml"
  workflow_dispatch:

defaults:
  run:
    working-directory: port-guard

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    name: ruff + pytest (Python ${{ matrix.python-version }})
    runs-on: windows-latest      # 目标平台就是 Windows：防火墙/编码相关逻辑必须在此验证
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: port-guard/requirements*.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx ruff mypy

      # 防回退：requirements.txt 一旦被改回 `PySide6`（完整版），会静默多装
      # Addons / WebEngine / Pdf 约 441 MB，而界面一个都用不到。这里直接卡住。
      - name: 依赖瘦身校验（必须只用 PySide6-Essentials）
        shell: pwsh
        run: |
          $bad = @('PySide6', 'PySide6-Addons', 'PySide6-WebEngine', 'PySide6-Pdf')
          $found = pip list --format=freeze |
            Where-Object { $bad -contains ($_ -split '==')[0] }
          if ($found) {
            Write-Error "检测到完整版 PySide6 组件，请改用 PySide6-Essentials：`n$found"
            exit 1
          }
          Write-Host 'OK：仅安装了 PySide6-Essentials'

      - name: 代码规范与静态缺陷（ruff）
        run: ruff check . --output-format=github

      - name: 格式检查（ruff format）
        run: ruff format --check .

      - name: 类型检查（mypy）
        run: mypy .

      - name: 单元测试 + 覆盖率
        run: pytest -q --cov --cov-report=term-missing --cov-report=xml

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-py${{ matrix.python-version }}
          path: port-guard/coverage.xml
          if-no-files-found: ignore
